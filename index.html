<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seattle Ferry Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-slate-50 text-slate-900 font-sans">
    <div class="max-w-4xl mx-auto">
        <header class="mb-10">
            <h1 class="text-3xl font-black">Seattle Pier 52</h1>
            <p class="text-xs font-bold text-blue-600 uppercase tracking-widest mt-1">Live Schedule</p>
        </header>

        <div id="schedule-grid" class="grid gap-6"></div>
    </div>
eeeee
    <script>
        function parseTime(t) {
            if (!t) return "TBA";
            const ms = parseInt(t.match(/\d+/)[0]);
            return new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        async function load() {
            const grid = document.getElementById('schedule-grid');
            try {
                const res = await fetch('/api/ferries');
                const data = await res.json();
                grid.innerHTML = '';

                data.routes.forEach(route => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-6 rounded-3xl shadow-sm border border-slate-100";
                    card.innerHTML = `
                        <h2 class="text-[10px] font-black text-slate-400 uppercase mb-4">${route.DepartingTerminal} to ${route.ArrivingTerminal}</h2>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            ${route.Times.map(t => `
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <p class="text-lg font-black text-slate-800">${parseTime(t.Time)}</p>
                                    <p class="text-[8px] font-bold text-slate-400 uppercase truncate">${t.Vessel}</p>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                grid.innerHTML = '<p class="text-red-500 font-bold">API Connection Failed</p>';
            }
        }

        load();
    </script>
</body>
</html>
