<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle Ferry Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .ferry-card { transition: transform 0.2s ease, border-color 0.2s ease; }
        .ferry-card:hover { transform: translateY(-2px); border-color: #3b82f6; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <header class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">Ferry Tracker</h1>
                <p id="status" class="text-xs font-bold text-blue-500 uppercase tracking-widest mt-1">Live from WSDOT</p>
            </div>
            
            <select id="terminal-select" class="w-full md:w-64 bg-slate-100 border-none rounded-xl px-4 py-3 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
                <option value="7">Seattle (Pier 52)</option>
                <option value="3">Bainbridge Island</option>
                <option value="4">Bremerton</option>
                <option value="9">Edmonds</option>
                <option value="15">Kingston</option>
                <option value="11">Fauntleroy (W. Seattle)</option>
                <option value="14">Mukilteo</option>
                <option value="10">Clinton</option>
            </select>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section>
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-4 ml-2">Current Departures</h2>
                <div id="departure-list" class="space-y-3"></div>
            </section>

            <section>
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-4 ml-2">Incoming Arrivals</h2>
                <div id="arrival-list" class="space-y-3"></div>
            </section>
        </div>
    </div>

    <script>
        const terminalSelect = document.getElementById('terminal-select');
        const depList = document.getElementById('departure-list');
        const arrList = document.getElementById('arrival-list');
        const status = document.getElementById('status');

        function formatWSDOTTime(wsdotDate) {
            if (!wsdotDate) return "TBA";
            let date;
            // Handle /Date(12345678)/ format
            if (wsdotDate.includes('Date')) {
                const timestamp = parseInt(wsdotDate.match(/\d+/)[0]);
                date = new Date(timestamp);
            } else {
                date = new Date(wsdotDate);
            }
            return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        async function refreshSchedule() {
            const tid = terminalSelect.value;
            status.innerText = "Updating...";

            try {
                const response = await fetch(`/api/ferries?terminalId=${tid}`);
                const data = await response.json();

                depList.innerHTML = '';
                arrList.innerHTML = '';

                if (!data.TerminalComboDetails || data.TerminalComboDetails.length === 0) {
                    const empty = `<div class="p-8 text-center text-slate-400 font-medium bg-white rounded-2xl border-2 border-dashed">No more boats today</div>`;
                    depList.innerHTML = empty;
                    arrList.innerHTML = empty;
                    return;
                }

                data.TerminalComboDetails.forEach(route => {
                    // Check if this route is a departure from our selected pier
                    const isDeparture = String(route.DepartingTerminalID) === String(tid);

                    route.Times.forEach(trip => {
                        const time = formatWSDOTTime(trip.DepartingTime);
                        const card = `
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 ferry-card shadow-sm">
                                <div class="flex justify-between items-center">
                                    <div>
                                        <p class="text-[10px] font-black text-blue-500 uppercase mb-1">${isDeparture ? 'To' : 'From'}</p>
                                        <p class="font-bold text-slate-800">${route.ArrivingDescription}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-2xl font-black text-slate-900">${time}</p>
                                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${trip.VesselName || 'TBA'}</p>
                                    </div>
                                </div>
                            </div>
                        `;

                        if (isDeparture) depList.innerHTML += card;
                        else arrList.innerHTML += card;
                    });
                });

                status.innerText = `Updated ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            } catch (err) {
                status.innerText = "Connection Error";
                console.error(err);
            }
        }

        terminalSelect.addEventListener('change', refreshSchedule);
        refreshSchedule();
        setInterval(refreshSchedule, 30000); // Auto-refresh every 30s
    </script>
</body>
</html>
