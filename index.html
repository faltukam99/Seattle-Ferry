<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle Ferry Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .ferry-card { transition: transform 0.2s; }
        .ferry-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">Seattle Terminal</h1>
                <p id="status" class="text-sm text-slate-500 font-medium">Connecting to WSDOT...</p>
            </div>
            <div class="flex gap-2">
                <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-bold uppercase tracking-wider">Live Schedule</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <div>
                <h2 class="text-lg font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center">
                    <span class="mr-2">🚢</span> Departures
                </h2>
                <div id="departure-list" class="space-y-3">
                    </div>
            </div>

            <div>
                <h2 class="text-lg font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center">
                    <span class="mr-2">⚓</span> Arrivals
                </h2>
                <div id="arrival-list" class="space-y-3">
                    </div>
            </div>

        </div>
    </div>

    <script>
        const SEATTLE_ID = 7; 

        async function fetchFerryData() {
            const status = document.getElementById('status');
            const depList = document.getElementById('departure-list');
            const arrList = document.getElementById('arrival-list');

            try {
                // Call your Vercel Serverless Function
                const response = await fetch('/api/ferries');
                
                if (!response.ok) {
                    throw new Error(`API Error (${response.status})`);
                }
                
                const data = await response.json();

                // Clear current lists
                depList.innerHTML = '';
                arrList.innerHTML = '';

                if (!data.TerminalComboDetails || data.TerminalComboDetails.length === 0) {
                    status.innerText = "No ferry data available right now.";
                    return;
                }

                data.TerminalComboDetails.forEach(route => {
                    // Logic to determine if this is a boat LEAVING Seattle
                    const isDeparture = (route.DepartingTerminalID == SEATTLE_ID) || 
                                        (route.DepartingTerminalName && route.DepartingTerminalName.toLowerCase().includes("seattle"));

                    route.Times.forEach(trip => {
                        if (!trip.DepartingTime) return;

                        // Formatting the Time (e.g., 14:30 -> 2:30 PM)
                        const rawTime = trip.DepartingTime.includes('T') ? trip.DepartingTime.split('T')[1] : trip.DepartingTime;
                        const [h, m] = rawTime.split(':');
                        const hr = parseInt(h);
                        const displayTime = `${((hr + 11) % 12 + 1)}:${m} ${hr >= 12 ? 'PM' : 'AM'}`;

                        const card = `
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 ferry-card">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-slate-800 text-lg">${route.ArrivingDescription}</span>
                                    <span class="text-xl font-black text-blue-600">${displayTime}</span>
                                </div>
                                <div class="flex items-center mt-3 text-slate-400 text-[10px] font-bold uppercase tracking-widest">
                                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    ${trip.VesselName || "Vessel TBA"}
                                </div>
                            </div>
                        `;

                        if (isDeparture) {
                            depList.innerHTML += card;
                        } else {
                            arrList.innerHTML += card;
                        }
                    });
                });

                status.innerText = `Updated: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                status.classList.remove('text-red-500');

            } catch (error) {
                console.error("Ferry Tracker Error:", error);
                status.innerText = "Error: " + error.message + ". Check Vercel Functions logs.";
                status.classList.add('text-red-500');
            }
        }

        // Initial Load
        fetchFerryData();

        // Refresh every 60 seconds
        setInterval(fetchFerryData, 60000);
    </script>
</body>
</html>
