<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle Ferry Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .card { transition: all 0.2s ease; }
        .card:hover { border-color: #3b82f6; transform: translateY(-2px); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <header class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Ferry Tracker</h1>
            <select id="terminal-select" class="w-full md:w-64 bg-slate-100 border-none rounded-xl px-4 py-3 font-bold text-slate-700 outline-none">
                <option value="7">Seattle (Pier 52)</option>
                <option value="3">Bainbridge Island</option>
                <option value="4">Bremerton</option>
                <option value="9">Edmonds</option>
                <option value="15">Kingston</option>
            </select>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section>
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 ml-2">Departures</h2>
                <div id="dep-list" class="space-y-3"></div>
            </section>
            <section>
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 ml-2">Arrivals</h2>
                <div id="arr-list" class="space-y-3"></div>
            </section>
        </div>
    </div>

    <script>
        const terminalSelect = document.getElementById('terminal-select');
        
        function parseTime(timeStr) {
            if (!timeStr) return "TBA";
            // Handle XML format (2026-04-21T15:30:00) or JSON format (/Date/)
            let date;
            if (timeStr.includes('Date')) {
                date = new Date(parseInt(timeStr.match(/\d+/)[0]));
            } else {
                date = new Date(timeStr);
            }
            return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        async function update() {
            const tid = terminalSelect.value;
            const res = await fetch(`/api/ferries?terminalId=${tid}`);
            const data = await res.json();
            
            const depList = document.getElementById('dep-list');
            const arrList = document.getElementById('arr-list');
            depList.innerHTML = ''; arrList.innerHTML = '';

            data.TerminalComboDetails.forEach(route => {
                const isDep = String(route.DepartingTerminalID) === String(tid);
                
                route.Times.forEach(t => {
                    const card = `
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 card shadow-sm flex justify-between items-center">
                            <div>
                                <p class="text-[10px] font-black text-blue-500 uppercase">${route.ArrivingDescription}</p>
                                <p class="text-xl font-black text-slate-800">${parseTime(t.DepartingTime)}</p>
                            </div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${t.VesselName}</p>
                        </div>
                    `;
                    if (isDep) depList.innerHTML += card;
                    else arrList.innerHTML += card;
                });
            });
        }

        terminalSelect.addEventListener('change', update);
        update();
    </script>
</body>
</html>
