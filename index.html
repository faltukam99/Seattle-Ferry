<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle Ferry LivE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .ferry-card { transition: transform 0.2s; }
        .ferry-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header class="bg-blue-700 text-white p-6 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">Seattle Ferry LivE</h1>
            <span class="text-sm bg-blue-600 px-3 py-1 rounded-full border border-blue-400">Terminal: Colman Dock</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        <div id="status" class="mb-6 text-sm text-slate-500 italic">Updating real-time schedule...</div>

        <div class="grid md:grid-cols-2 gap-6">
            <section>
                <h2 class="text-lg font-semibold mb-4 flex items-center">
                    <span class="mr-2">🚢</span> Departures from Seattle
                </h2>
                <div id="departure-list" class="space-y-3">
                    </div>
            </section>

            <section>
                <h2 class="text-lg font-semibold mb-4 flex items-center">
                    <span class="mr-2">📍</span> Arrivals to Seattle
                </h2>
                <div id="arrival-list" class="space-y-3">
                    </div>
            </section>
        </div>
    </main>
<script>
    // Your verified API key and Terminal ID
    const API_KEY = '08c4d590-560c-49dd-9b30-e9089c77e02d'; 
    const SEATTLE_ID = 7; 

    async function fetchFerryData() {
        const status = document.getElementById('status');
        const depList = document.getElementById('departure-list');
        const arrList = document.getElementById('arrival-list');

        // 1. Define the original URL
        const wsdotUrl = `https://wsdot.wa.gov/Ferries/API/Schedule/rest/terminaltoday/${SEATTLE_ID}?apiaccesscode=${API_KEY}`;
        
        // 2. Wrap it in the AllOrigins proxy URL to bypass CORS
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(wsdotUrl)}`;

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('Proxy server error');
            
            const wrapper = await response.json();
            
            // 3. The proxy returns the WSDOT data inside a string called 'contents'
            const data = JSON.parse(wrapper.contents);
            
            depList.innerHTML = '';
            arrList.innerHTML = '';

            if (!data.TerminalComboDetails || data.TerminalComboDetails.length === 0) {
                status.innerText = "No ferry data available right now.";
                return;
            }

            data.TerminalComboDetails.forEach(route => {
                route.Times.forEach(trip => {
                    const time = trip.DepartingTime.split('T')[1].substring(0, 5);
                    const destination = route.ArrivingDescription;
                    const vessel = trip.VesselName || "Vessel TBA";

                    const card = `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-blue-900">${destination}</span>
                                <span class="text-lg font-black text-blue-600">${time}</span>
                            </div>
                            <div class="text-[10px] text-slate-400 mt-2 uppercase tracking-widest">${vessel}</div>
                        </div>
                    `;

                    if (route.DepartingTerminalID === SEATTLE_ID) {
                        depList.innerHTML += card;
                    } else {
                        arrList.innerHTML += card;
                    }
                });
            });

            status.innerText = `Last sync: ${new Date().toLocaleTimeString()}`;

        } catch (error) {
            console.error("Fetch error:", error);
            status.innerText = "Failed to bypass CORS. Try refreshing.";
        }
    }

    // Initialize the app
    fetchFerryData();
    // Refresh every 2 minutes
    setInterval(fetchFerryData, 120000);
</script>
     

</body>
</html>
