<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSDOT Ferry Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card-glow { transition: all 0.3s ease; }
        .card-glow:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.1); }
        .loader { border-top-color: #3b82f6; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">Ferry Tracker</h1>
                <p id="status" class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-widest leading-relaxed">Initializing System...</p>
            </div>

            <div class="relative w-full md:w-72">
                <label class="absolute -top-2 left-3 bg-white px-2 text-[10px] font-black text-blue-600 uppercase">Terminal</label>
                <select id="terminal-select" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-4 py-4 font-bold text-slate-700 appearance-none focus:border-blue-500 focus:bg-white transition-all outline-none">
                    <option value="7">Seattle (Pier 52)</option>
                    <option value="3">Bainbridge Island</option>
                    <option value="4">Bremerton</option>
                    <option value="11">Fauntleroy (W. Seattle)</option>
                    <option value="22">Vashon Island</option>
                    <option value="19">Southworth</option>
                    <option value="9">Edmonds</option>
                    <option value="15">Kingston</option>
                    <option value="14">Mukilteo</option>
                    <option value="10">Clinton</option>
                    <option value="1">Anacortes</option>
                    <option value="20">Friday Harbor</option>
                </select>
                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none opacity-50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </div>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            
            <section>
                <div class="flex items-center justify-between mb-6 px-2">
                    <h2 class="text-sm font-black text-blue-600 uppercase tracking-[0.25em] flex items-center">
                        <span class="bg-blue-600 w-2 h-2 rounded-full mr-3"></span> Departures
                    </h2>
                    <span id="dep-count" class="text-[10px] font-bold bg-blue-50 text-blue-600 px-2 py-1 rounded-md">0 found</span>
                </div>
                <div id="departure-list" class="space-y-4"></div>
            </section>

            <section>
                <div class="flex items-center justify-between mb-6 px-2">
                    <h2 class="text-sm font-black text-emerald-600 uppercase tracking-[0.25em] flex items-center">
                        <span class="bg-emerald-600 w-2 h-2 rounded-full mr-3"></span> Arrivals
                    </h2>
                    <span id="arr-count" class="text-[10px] font-bold bg-emerald-50 text-emerald-600 px-2 py-1 rounded-md">0 found</span>
                </div>
                <div id="arrival-list" class="space-y-4"></div>
            </section>

        </main>
    </div>

    <script>
        const terminalSelect = document.getElementById('terminal-select');
        const status = document.getElementById('status');
        const depList = document.getElementById('departure-list');
        const arrList = document.getElementById('arrival-list');

        async function fetchFerrySchedule() {
            const tid = terminalSelect.value;
            
            // UI States
            status.innerHTML = `<span class="flex items-center"><div class="loader w-3 h-3 border-2 rounded-full mr-2"></div> SYNCING WITH WSDOT...</span>`;
            
            try {
                const response = await fetch(`/api/ferries?terminalId=${tid}`);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                
                // Clear UI
                depList.innerHTML = '';
                arrList.innerHTML = '';
                let counts = { dep: 0, arr: 0 };

                if (!data.TerminalComboDetails || data.TerminalComboDetails.length === 0) {
                    const emptyState = `<div class="bg-white/50 border-2 border-dashed border-slate-200 rounded-3xl p-10 text-center text-slate-400 font-bold">No active sailings found</div>`;
                    depList.innerHTML = emptyState;
                    arrList.innerHTML = emptyState;
                    status.innerText = "STANDBY - NO ACTIVE DATA";
                    return;
                }

                data.TerminalComboDetails.forEach(route => {
                    // SOAP/XML returns IDs as strings, so we use loose comparison
                    const isDeparture = String(route.DepartingTerminalID) === String(tid);

                    route.Times.forEach(trip => {
                        if (!trip.DepartingTime) return;

                        // Parse WSDOT Time Format (Handles ISO and Time-only)
                        const raw = trip.DepartingTime.includes('T') ? trip.DepartingTime.split('T')[1] : trip.DepartingTime;
                        const [h, m] = raw.split(':');
                        const hr = parseInt(h);
                        const displayTime = `${((hr + 11) % 12 + 1)}:${m} ${hr >= 12 ? 'PM' : 'AM'}`;

                        const card = `
                            <div class="bg-white border border-slate-200 p-5 rounded-3xl card-glow relative overflow-hidden">
                                <div class="flex justify-between items-center relative z-10">
                                    <div class="flex flex-col">
                                        <span class="text-[9px] font-black text-slate-300 uppercase tracking-tighter mb-1">To Port</span>
                                        <span class="font-extrabold text-slate-800 text-lg leading-none">${route.ArrivingDescription}</span>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-2xl font-black text-slate-900 tabular-nums">${displayTime}</span>
                                    </div>
                                </div>
                                <div class="mt-4 pt-4 border-t border-slate-50 flex items-center justify-between text-slate-400">
                                    <div class="flex items-center text-[10px] font-bold uppercase italic tracking-wide">
                                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2.5"></path></svg>
                                        ${trip.VesselName || "Assigned TBA"}
                                    </div>
                                    <div class="h-1.5 w-1.5 rounded-full bg-green-400"></div>
                                </div>
                            </div>
                        `;

                        if (isDeparture) {
                            depList.innerHTML += card;
                            counts.dep++;
                        } else {
                            arrList.innerHTML += card;
                            counts.arr++;
                        }
                    });
                });

                // Update counts and status
                document.getElementById('dep-count').innerText = `${counts.dep} found`;
                document.getElementById('arr-count').innerText = `${counts.arr} found`;
                status.innerText = `LAST SYNC: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

            } catch (err) {
                console.error("Critical Failure:", err);
                status.innerHTML = `<span class="text-red-500">OFFLINE: DATA TIMEOUT</span>`;
                depList.innerHTML = `<div class="p-4 text-red-400 bg-red-50 rounded-2xl text-xs font-bold">API Failure. Ensure your Vercel Function is running.</div>`;
            }
        }

        // Listeners
        terminalSelect.addEventListener('change', fetchFerrySchedule);
        
        // Initial Fetch
        fetchFerrySchedule();

        // Refresh every minute
        setInterval(fetchFerrySchedule, 60000);
    </script>
</body>
</html>
