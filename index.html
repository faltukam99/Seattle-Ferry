<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seattle Ferry Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-6xl mx-auto">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-end gap-4">
            <div>
                <h1 class="text-4xl font-black text-slate-900 tracking-tight">Seattle Ferry Terminal</h1>
                <p id="clock" class="text-blue-600 font-bold uppercase tracking-widest text-xs mt-2 italic"></p>
            </div>
            <select id="terminal-select" class="bg-white border-2 border-slate-200 rounded-2xl px-6 py-3 font-bold text-slate-700 outline-none focus:border-blue-500 shadow-sm">
                <option value="7">Seattle (Pier 52)</option>
                <option value="3">Bainbridge Island</option>
                <option value="4">Bremerton</option>
                <option value="9">Edmonds</option>
                <option value="15">Kingston</option>
            </select>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <section>
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.3em] mb-6 border-b pb-2">Outbound Departures</h2>
                <div id="dep-list" class="space-y-4"></div>
            </section>

            <section>
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.3em] mb-6 border-b pb-2">Inbound Arrivals</h2>
                <div id="arr-list" class="space-y-4"></div>
            </section>
        </div>
    </div>

    <script>
        const terminalSelect = document.getElementById('terminal-select');
        
        function parseWSDOTDate(jsonDate) {
            const timestamp = parseInt(jsonDate.replace(/\/Date\((\d+).*/, '$1'));
            return new Date(timestamp);
        }

        async function updateDashboard() {
            const tid = terminalSelect.value;
            document.getElementById('clock').innerText = `Syncing: ${new Date().toLocaleTimeString()}`;
            
            try {
                const response = await fetch(`/api/ferries?terminalId=${tid}`);
                const data = await response.json();
                
                const depList = document.getElementById('dep-list');
                const arrList = document.getElementById('arr-list');
                depList.innerHTML = ''; 
                arrList.innerHTML = '';

                data.routes.forEach(route => {
                    route.Sailings.forEach(sailing => {
                        const time = parseWSDOTDate(sailing.Time);
                        const displayTime = time.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
                        
                        const isPast = time < new Date();
                        const card = `
                            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center ${isPast ? 'opacity-40 grayscale' : ''}">
                                <div>
                                    <p class="text-[10px] font-black text-blue-500 uppercase">${route.ArrivingTerminalName}</p>
                                    <p class="text-xl font-black text-slate-800 tracking-tight">${displayTime}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${sailing.VesselName || 'Vessel TBA'}</p>
                                    <div class="inline-block px-2 py-1 bg-slate-100 rounded text-[9px] font-black text-slate-500 mt-1 uppercase">On Time</div>
                                </div>
                            </div>
                        `;

                        // If the origin is our selected terminal, it's a departure
                        if (String(route.DepartingTerminalID) === String(tid)) {
                            depList.innerHTML += card;
                        } else {
                            arrList.innerHTML += card;
                        }
                    });
                });
            } catch (e) {
                console.error("Fetch failed", e);
            }
        }

        terminalSelect.addEventListener('change', updateDashboard);
        updateDashboard();
        setInterval(updateDashboard, 60000);
    </script>
</body>
</html>
