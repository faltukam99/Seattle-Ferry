<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle Ferry LivE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .ferry-card { transition: transform 0.2s; }
        .ferry-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header class="bg-blue-700 text-white p-6 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">Seattle Ferry LivE</h1>
            <span class="text-sm bg-blue-600 px-3 py-1 rounded-full border border-blue-400">Terminal: Colman Dock</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        <div id="status" class="mb-6 text-sm text-slate-500 italic">Updating real-time schedule...</div>

        <div class="grid md:grid-cols-2 gap-6">
            <section>
                <h2 class="text-lg font-semibold mb-4 flex items-center">
                    <span class="mr-2">🚢</span> Departures from Seattle
                </h2>
                <div id="departure-list" class="space-y-3">
                    </div>
            </section>

            <section>
                <h2 class="text-lg font-semibold mb-4 flex items-center">
                    <span class="mr-2">📍</span> Arrivals to Seattle
                </h2>
                <div id="arrival-list" class="space-y-3">
                    </div>
            </section>
        </div>
    </main>

    <script>
        // REPLACE THIS WITH YOUR FREE KEY FROM WSDOT
        const API_KEY = '08c4d590-560c-49dd-9b30-e9089c77e02d'; 
        const SEATTLE_ID = 7; 

       
async function fetchFerryData() {
    const status = document.getElementById('status');
    const depList = document.getElementById('departure-list');
    const arrList = document.getElementById('arrival-list');

    // Use the exact base URL format that just worked for you
    const url = `https://wsdot.wa.gov/Ferries/API/Schedule/rest/terminaltoday/${SEATTLE_ID}?apiaccesscode=${API_KEY}`;

    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Network response was not ok');
        
        const data = await response.json();
        
        // Clear lists
        depList.innerHTML = '';
        arrList.innerHTML = '';

        // WSDOT terminaltoday returns 'TerminalComboDetails'
        data.TerminalComboDetails.forEach(route => {
            route.Times.forEach(trip => {
                // Determine if it's arriving or departing based on the description
                // Usually, if the 'DepartingTerminalName' is Seattle, it's a departure.
                const isDeparture = route.DepartingTerminalName.includes("Seattle");
                
                const card = `
                    <div class="ferry-card bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center">
                            <span class="font-medium text-blue-800">${route.Description}</span>
                            <span class="text-lg font-bold">${trip.DepartingTime.split('T')[1].substring(0,5)}</span>
                        </div>
                        <div class="text-xs text-slate-400 mt-1 uppercase tracking-widest">
                            ${trip.VesselName || 'Vessel TBA'}
                        </div>
                    </div>
                `;

                if (isDeparture) {
                    depList.innerHTML += card;
                } else {
                    arrList.innerHTML += card;
                }
            });
        });

        status.innerText = `Last updated: ${new Date().toLocaleTimeString()}`;

    } catch (error) {
        status.innerText = "Connection successful, but schedule data format changed.";
        console.error("Fetch error:", error);
    }
}

        function renderSchedule(data) {
    const depList = document.getElementById('departure-list');
    const arrList = document.getElementById('arrival-list');
    
    // Clear the existing lists
    depList.innerHTML = '';
    arrList.innerHTML = '';

    // The 'terminaltoday' endpoint returns an object called 'TerminalComboDetails'
    if (!data.TerminalComboDetails || data.TerminalComboDetails.length === 0) {
        depList.innerHTML = '<p class="text-sm text-slate-400">No scheduled departures found.</p>';
        return;
    }

    data.TerminalComboDetails.forEach(route => {
        // 'Times' is the array of individual ferry sailings
        route.Times.forEach(trip => {
            
            // Format the time (WSDOT returns "2026-04-21T14:35:00")
            const rawTime = trip.DepartingTime.split('T')[1]; 
            const formattedTime = rawTime.substring(0, 5); // Results in "14:35"

            const cardHtml = `
                <div class="ferry-card bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center">
                        <span class="font-medium text-blue-900">${route.ArrivingDescription}</span>
                        <span class="text-lg font-bold text-blue-600">${formattedTime}</span>
                    </div>
                    <div class="flex justify-between mt-2">
                        <span class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">
                            ${trip.VesselName || 'Vessel TBA'}
                        </span>
                        ${trip.Annotation ? `<span class="text-[10px] text-orange-500 font-bold">⚠️ Alert</span>` : ''}
                    </div>
                </div>
            `;

            // If the departing terminal is Seattle (ID 7), it's a departure
            if (route.DepartingTerminalID === 7) {
                depList.innerHTML += cardHtml;
            } else {
                arrList.innerHTML += cardHtml;
            }
        });
    });
}

        // Run on load
        fetchFerryData();
        // Auto-refresh every 2 minutes
        setInterval(fetchFerryData, 120000);
    </script>
</body>
</html>
